  (function () {
    var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
    var amz = function (title, author) {
      var q = (title + " " + author).replace(/[\u00b7\u2014\u2013]/g, " ").replace(/\([^)]*\)/g, " ").replace(/\s+/g, " ").trim();
      return "https://www.amazon.com/s?k=" + encodeURIComponent(q) + "&i=stripbooks";
    };
    var art = function (title, author, cover) {
      if (cover) return '<img class="bk-cover" src="covers/' + esc(cover) + '" alt="' + esc(title) + '" loading="lazy" width="180" height="270">';
      return '<span class="bk-tile"><span class="tt">' + esc(title) + '</span><span class="ta">' + esc(author) + '</span></span>';
    };
    var cell = function (title, author, cover, cls) {
      var cap = cover ? '<span class="cap"><span class="c-title">' + esc(title) + '</span><span class="c-author">' + esc(author) + '</span></span>' : '';
      return '<a class="cell ' + cls + '" href="' + esc(amz(title, author)) + '" target="_blank" rel="noopener" title="' + esc(title + ' — ' + author) + ' (Amazon)">' +
        '<span class="art">' + art(title, author, cover) + '</span>' + cap +
        '</a>';
    };

    var now = document.getElementById("now-list");
    if (now) now.innerHTML = NOW_READING.map(function (b) { return cell(b.title, b.author, b.cover, "cell-now"); }).join("");

    var shelf = document.getElementById("shelf");
    if (shelf) shelf.innerHTML = SHELF.map(function (g) {
      var cells = g.books.map(function (bk) { return cell(bk[0], bk[1], bk[2], "cell-shelf"); }).join("");
      return '<section class="genre">' +
        '<div class="genre-head"><span class="g-name">' + esc(g.genre) + '</span>' +
        '<span class="g-count">' + g.books.length + '</span><span class="g-line"></span></div>' +
        '<div class="book-grid">' + cells + '</div></section>';
    }).join("");
  })();

<script>
  (function () {
    var root = document.documentElement;
    var stored = null;
    try { stored = localStorage.getItem("nc-theme"); } catch (e) {}
    var initial = stored || ((window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light");
    root.setAttribute("data-theme", initial);
    var btn = document.getElementById("theme-toggle");
    if (btn) {
      btn.addEventListener("click", function () {
        var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        try { localStorage.setItem("nc-theme", next); } catch (e) {}
      });
    }
  })();
</script>
