<body>
<div id="mapbg" aria-hidden="true"></div>

<button id="theme-toggle" type="button" aria-label="Toggle light and dark mode" title="Toggle theme">
  <svg class="moon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  <svg class="sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
</button>

<main class="view active" id="view-thoughts">
  <div class="shell">
    <nav class="tabs" aria-label="Sections">
      <a class="tab" href="/">Writing</a>
      <a class="tab" href="/reading/">Reading</a>
      <a class="tab is-active" href="/thoughts/" aria-current="page">Thoughts</a>
    </nav>

    <section class="thoughts" id="thoughts" aria-labelledby="thoughts-h">
      <header class="page-head">
        <h1 class="page-title" id="thoughts-h">Thoughts</h1>
        <p class="thoughts-intro">Short takes and quick thoughts. Follow along at
          <a href="https://x.com/build_n_fight" target="_blank" rel="noopener me">@build_n_fight</a>.</p>
      </header>

      <div class="thoughts-list" id="thoughts-list" aria-live="polite">
        <p class="thoughts-empty">Loading posts from
          <a href="https://x.com/build_n_fight" target="_blank" rel="noopener me">@build_n_fight</a>…</p>
      </div>

      <footer class="home-foot">© 2026 Nathan Colestock</footer>
    </section>
  </div>
</main>

<script>
  /* ==========================================================================
     Thoughts feed data — X post IDs, NEWEST FIRST.
     Auto-maintained: `scripts/sync_x_thoughts.py` rewrites the list between the
     SYNC markers below from @build_n_fight's timeline. To add one by hand, drop
     the numeric status id (the digits after /status/) as a new first line.
     ========================================================================== */
  var X_HANDLE = "build_n_fight";
  var POST_IDS = [
    /* SYNC:START — do not edit inside; managed by scripts/sync_x_thoughts.py */
    "2081185942744793389"
    /* SYNC:END */
  ];

  window.renderThoughts = function () {
    var el = document.getElementById("thoughts-list");
    if (!el || !window.twttr || !window.twttr.widgets) return;
    var theme = document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
    if (!POST_IDS.length) {
      el.innerHTML = '<p class="thoughts-empty">Nothing here yet — follow along ' +
        '<a href="https://x.com/' + X_HANDLE + '" target="_blank" rel="noopener me">@' + X_HANDLE + '</a>.</p>';
      return;
    }
    // Programmatic render (reliable + re-themeable) — one card per post, in order.
    el.innerHTML = "";
    POST_IDS.forEach(function (id) {
      var slot = document.createElement("div");
      slot.className = "tw-slot";
      el.appendChild(slot);
      window.twttr.widgets.createTweet(String(id), slot, {
        theme: theme, dnt: true, conversation: "none", align: "center"
      });
    });
  };
</script>
<script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
<script>
  (function () {
    var tries = 0;
    (function wait() {
      if (window.twttr && window.twttr.widgets) { window.renderThoughts(); return; }
      if (tries++ > 60) {
        var el = document.getElementById("thoughts-list");
        if (el) el.innerHTML = '<p class="thoughts-empty">Couldn\'t load posts right now — ' +
          'read the latest at <a href="https://x.com/' + X_HANDLE + '" target="_blank" rel="noopener me">@' + X_HANDLE + '</a>.</p>';
        return;
      }
      setTimeout(wait, 150);
    })();
  })();
</script>

<script>
  (function () {
    var root = document.documentElement;
    var stored = null;
    try { stored = localStorage.getItem("nc-theme"); } catch (e) {}
    var initial = stored || ((window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light");
    root.setAttribute("data-theme", initial);
    var btn = document.getElementById("theme-toggle");
    if (btn) {
      btn.addEventListener("click", function () {
        var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        try { localStorage.setItem("nc-theme", next); } catch (e) {}
        if (window.renderThoughts) window.renderThoughts(); // re-render embeds in the new theme
      });
    }
  })();
</script>
